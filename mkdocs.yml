      - 피코넷과 기저대역: classic/baseband.md
      - 조회와 페이징: classic/inquiry-paging.md
      - 링크 관리자 (LMP): classic/lmp.md
      - ACL과 SCO/eSCO: classic/acl-sco.md
      - L2CAP·SDP·RFCOMM: classic/l2cap-sdp-rfcomm.md
      - 오디오 프로파일 (A2DP·AVRCP·HFP): classic/audio-profiles.md
      - 데이터 프로파일 (SPP·HID·PAN): classic/data-profiles.md
  - LE Audio:
