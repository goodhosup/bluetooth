site_name: Bluetooth Handbook — Classic · LE · LE Audio
site_description: Bluetooth Classic(BR/EDR)과 Low Energy, LE Audio, Mesh, Core 6.x Channel Sounding까지 — 초급부터 전문가까지 단계적으로 읽는 블루투스 핸드북
site_author: Bluetooth Handbook
site_url: https://goodhosup.github.io/bluetooth/
repo_url: https://github.com/goodhosup/bluetooth
repo_name: bluetooth
edit_uri: edit/main/docs/
copyright: 본문과 그림은 직접 작성했습니다. Bluetooth SIG 규격(Core Specification, 프로파일·서비스 규격)은 문서 이름과 Vol/Part/절만 출처 표기로 인용합니다.

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    logo: material/bluetooth
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - path: javascripts/diagrams.mjs
    type: module

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        # Material 기본 Mermaid 통합 대신 javascripts/diagrams.mjs가 렌더링 (큰 시퀀스 다이어그램 가독성)
        - name: mermaid
          class: diagram-src
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

validation:
  anchors: warn

watch:
  - includes

nav:
  - 홈: index.md
  - 시작하기:
      - getting-started/index.md
      - Bluetooth 세대와 Core 버전: getting-started/generations.md
      - Bluetooth SIG와 규격 체계: getting-started/sig-specs.md
      - 규격 문서 읽는 법: getting-started/reading-specs.md
      - 학습 로드맵: getting-started/roadmap.md
  - 공통 기초:
      - basics/index.md
      - 2.4 GHz ISM 대역과 규제: basics/ism-band.md
      - 무선 전파와 링크 버짓: basics/radio-channel.md
      - 디지털 변조 (GFSK·DPSK): basics/modulation.md
      - 주파수 도약과 AFH: basics/fhss-afh.md
      - 저전력 설계 원리: basics/low-power.md
      - Host·Controller·HCI: basics/architecture.md
      - 프로토콜 스택 개요: basics/stack.md
      - 디바이스 주소: basics/addresses.md
      - Wi-Fi와의 공존: basics/coexistence.md
  - LE 컨트롤러:
      - le/index.md
      - 물리계층:
          - LE PHY (1M·2M·Coded): le/phy.md
          - 채널과 송신 전력: le/channels.md
          - 패킷 구조: le/packet.md
      - 링크 계층:
          - 링크 계층 상태 기계: le/link-layer-states.md
          - 레거시 광고: le/legacy-advertising.md
          - 확장 광고: le/extended-advertising.md
          - 주기적 광고와 PAwR: le/periodic-advertising.md
