          - 연결 수립: le/connection.md
          - 연결 이벤트와 파라미터: le/connection-events.md
          - 채널 선택 알고리즘: le/channel-selection.md
          - LL 제어 절차: le/ll-control.md
          - 데이터 길이 확장 (DLE): le/data-length.md
          - LE 전력 제어: le/power-control.md
      - 고급 기능:
          - 등시성 채널 (CIS·BIS): le/iso.md
          - 방향 탐지 (AoA·AoD): le/direction-finding.md
          - Channel Sounding: le/channel-sounding.md
  - LE 호스트:
      - host/index.md
      - L2CAP: host/l2cap.md
      - ATT: host/att.md
      - GATT: host/gatt.md
      - EATT: host/eatt.md
      - GAP: host/gap.md
      - 광고 데이터 형식 (AD Type): host/ad-types.md
      - 대표 GATT 서비스: host/gatt-services.md
      - 처리량 최적화: host/throughput.md
  - 보안:
      - security/index.md
      - 보안 모델의 진화: security/evolution.md
